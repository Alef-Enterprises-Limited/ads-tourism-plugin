name: Build development artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact:
    name: Build unsigned development ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.2"
          extensions: zip
          coverage: none

      - name: Verify version metadata
        run: php bin/verify-version.php

      - name: Build and verify development artifact
        run: |
          php bin/build-release.php
          php bin/verify-release.php

      - name: Upload unsigned development artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ads-tourism-${{ github.sha }}
          path: |
            build/ads-tourism-*.zip
            build/ads-tourism-*.zip.sha256
            build/ads-tourism-*-manifest.json
          if-no-files-found: error
          retention-days: 14
