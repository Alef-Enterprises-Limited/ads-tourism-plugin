name: Compatibility checks

on:
  schedule:
    - cron: "17 20 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supported-runtime:
    name: PHP ${{ matrix.php }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Install and audit dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          composer audit --no-interaction

      - name: Run compatibility suite
        run: composer check

      - name: Verify installable artifact
        run: |
          php bin/verify-version.php
          php bin/build-release.php
          php bin/verify-release.php
