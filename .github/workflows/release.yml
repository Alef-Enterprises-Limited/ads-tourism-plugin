name: Publish release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  release:
    name: Verify and publish plugin ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: "8.2"
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit Composer dependencies
        run: composer audit --no-interaction

      - name: Verify tag and version metadata
        run: php bin/verify-version.php "${GITHUB_REF_NAME}"

      - name: Run formatting, analysis, and tests
        run: composer check

      - name: Build plugin ZIP
        run: php bin/build-release.php

      - name: Verify release artifacts
        run: php bin/verify-release.php

      - name: Create draft GitHub release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          build/ads-tourism-*.zip
          build/ads-tourism-*.zip.sha256
          build/ads-tourism-*-manifest.json
          --draft
          --generate-notes
          --title "ADS Tourism ${GITHUB_REF_NAME}"

      - name: Verify attached release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_count="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets | length')"
          test "${asset_count}" -eq 3

      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
